{% extends "base.html" %}
{% block title %}Редактировать товар — Админ | RoboMarket{% endblock %}

{% block content %}
<section class="admin-section">
    <div class="container">
        <h1 class="page-title">✏ Редактировать товар</h1>

        <div class="admin-form-card">
            <form method="post" action="/admin/products/{{ product.id }}/edit" class="form">
                <div class="form-group">
                    <label for="name">Название товара *</label>
                    <input type="text" id="name" name="name" required value="{{ product.name }}">
                </div>
                <div class="form-group">
                    <label for="short_description">Краткое описание</label>
                    <input type="text" id="short_description" name="short_description" value="{{ product.short_description }}">
                </div>
                <div class="form-group">
                    <label for="full_description">Полное описание</label>
                    <textarea id="full_description" name="full_description" rows="5">{{ product.full_description }}</textarea>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="price">Цена (₽) *</label>
                        <input type="number" id="price" name="price" required min="1" step="0.01" value="{{ product.price }}">
                    </div>
                    <div class="form-group">
                        <label for="stock">Остаток на складе</label>
                        <input type="number" id="stock" name="stock" value="{{ product.stock }}" min="0">
                    </div>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="category_id">Категория *</label>
                        <select id="category_id" name="category_id" required>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if cat.id == product.category_id %}selected{% endif %}>{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="image_url">URL изображения</label>
                        <input type="text" id="image_url" name="image_url" value="{{ product.image_url }}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_active" value="true" {% if product.is_active %}checked{% endif %}>
                        Активный (отображается в каталоге)
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg">Сохранить изменения</button>
                    <a href="/admin/products" class="btn btn-outline btn-lg">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Добавить товар — Админ | RoboMarket{% endblock %}

{% block content %}
<section class="admin-section">
    <div class="container">
        <h1 class="page-title">➕ Добавить товар</h1>

        <div class="admin-form-card">
            <form method="post" action="/admin/products" class="form">
                <div class="form-group">
                    <label for="name">Название товара *</label>
                    <input type="text" id="name" name="name" required placeholder="Arduino Starter Kit">
                </div>
                <div class="form-group">
                    <label for="short_description">Краткое описание</label>
                    <input type="text" id="short_description" name="short_description" placeholder="Краткое описание для карточки">
                </div>
                <div class="form-group">
                    <label for="full_description">Полное описание</label>
                    <textarea id="full_description" name="full_description" rows="5" placeholder="Подробное описание товара..."></textarea>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="price">Цена (₽) *</label>
                        <input type="number" id="price" name="price" required min="1" step="0.01" placeholder="1000">
                    </div>
                    <div class="form-group">
                        <label for="stock">Остаток на складе</label>
                        <input type="number" id="stock" name="stock" value="0" min="0">
                    </div>
                </div>
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="category_id">Категория *</label>
                        <select id="category_id" name="category_id" required>
                            <option value="">— Выберите категорию —</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="image_url">URL изображения</label>
                        <input type="text" id="image_url" name="image_url" placeholder="https://example.com/image.jpg">
                    </div>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_active" value="true" checked>
                        Активный (отображается в каталоге)
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-lg">Создать товар</button>
                    <a href="/admin/products" class="btn btn-outline btn-lg">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}

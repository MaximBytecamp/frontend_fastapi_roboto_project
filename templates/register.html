{% extends "base.html" %}
{% block title %}Регистрация — RoboMarket{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <h1>Создать аккаунт</h1>
            <p class="auth-subtitle">Зарегистрируйтесь, чтобы покупать товары и отслеживать заказы</p>

            {% if error %}
                <div class="alert alert-error">{{ error.replace("|", "<br>")|safe }}</div>
            {% endif %}

            <form method="post" action="/auth/register" class="form" id="register-form">
                <div class="form-group">
                    <label for="name">Имя *</label>
                    <input type="text" id="name" name="name" required placeholder="Ваше имя" minlength="1">
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="ivan@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" name="password" required placeholder="Минимум 6 символов" minlength="6">
                </div>
                <div class="form-group">
                    <label for="password_confirm">Подтвердите пароль *</label>
                    <input type="password" id="password_confirm" name="password_confirm" required placeholder="Повторите пароль">
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block">Зарегистрироваться</button>
            </form>

            <p class="auth-footer">Уже есть аккаунт? <a href="/login">Войти</a></p>
        </div>
    </div>
</section>
{% endblock %}
